name: CI

on:
  push:
    branches: [main, "opencode-skills/**", "dev/**"]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same ref so a force-push or
# follow-up commit doesn't pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bun handles the workspace + TS execution; pinning the version so a
  # bun release doesn't silently break the lockfile or cause non-
  # deterministic node-modules layouts in CI.
  BUN_VERSION: 1.3.11

jobs:
  # ── Job 1: typecheck ──────────────────────────────────────────────
  # Runs `tsc --noEmit` across every workspace. Catches "PR adds a
  # field, forgets to update the consumer" before tests even compile.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck @arceus/db
        run: bun run --cwd packages/db typecheck
      - name: Typecheck @arceus/api
        run: bun run --cwd apps/api typecheck

  # ── Job 2: drift test (Spec 31 Phase 8.5) ─────────────────────────
  # Round-trips a canonical fixture per hydrated entity through
  # xToInsert → fake row → rowToX. Fails when a future PR adds a Zod
  # field but forgets the repo helper. No DB needed — purely Zod +
  # in-memory transforms.
  drift:
    name: Drift test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run drift test
        run: bun test packages/db/tests/drift.test.ts

  # ── Job 3: migration linter (Spec 31 Phase 8.5) ───────────────────
  # Fails if any migration file mixes DDL with DML. Catches the worst-
  # kind-of-failure migration shape ("succeeded but corrupted") at PR
  # time. No DB needed — pure file-system text scan.
  lint-migrations:
    name: Lint migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint migrations
        run: bun run --cwd packages/db db:lint-migrations

  # ── Job 4: ESLint (C2 audit — silent error swallowing + safety rails)
  # The flat config in `eslint.config.mjs` enforces `no-restricted-syntax`
  # against the silent-catch patterns surfaced by the C2 audit; new code
  # that adds `.catch(() => {})` or empty catch blocks fails this job.
  # Mirrors what `npm run lint` does locally.
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun x eslint .

  # ── Job 5: silent-catch lint (custom grep — narrow, zero false positives)
  # Complements the ESLint rule. ESLint's AST view also flags multi-line
  # comment-bodied catches (legitimate cleanup paths) which this script
  # ignores by design. The combination: ESLint catches structural
  # patterns + new code; the grep catches the truly bare swallows that
  # should never land regardless of context.
  silent-catch:
    name: Silent-catch lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run silent-catch lint
        run: bun scripts/check-no-silent-catch.ts

  # ── Job 6: secret scan (gitleaks) ─────────────────────────────────
  # Scans the FULL git history (fetch-depth: 0) for committed secrets on
  # every push/PR. Rules = default set + .gitleaks.toml allowlist. Fails
  # the job (blocks merge) if any credential lands in a commit.
  #
  # gitleaks-action is free for personal + public repos. If Arceus later
  # moves under a GitHub organization, add a (free) GITLEAKS_LICENSE repo
  # secret — see https://github.com/gitleaks/gitleaks-action#readme.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Note: db:explain-audit is intentionally NOT in CI ─────────────
  # The EXPLAIN audit needs a live Postgres + the canonical seed loaded.
  # Spinning up a `services: postgres:16` container, applying migrations,
  # and seeding adds ~30s per CI run — worth it eventually but not for
  # this initial CI cut. Run it manually via `bun --filter @arceus/db
  # run db:explain-audit` after material schema changes.
  #
  # When this graduates to CI, wire it as a separate `explain-audit`
  # job with services.postgres + db:migrate + db:seed steps before
  # invoking the audit. Budget: ~30s per run.
