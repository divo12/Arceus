<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arceus · Inspector</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f7;
    --border: #e3e6ec;
    --border-strong: #d0d5dd;
    --text: #1a1f2b;
    --text-dim: #5b6577;
    --text-mute: #8b96a8;
    --accent: #2f6feb;
    --green: #2da14a;
    --yellow: #b8860b;
    --red: #d93748;
    --purple: #7c4dff;
    --orange: #d97706;
    --cyan: #0891b2;
    --pink: #c2185b;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }

  body { display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ───────────────────────────────────── */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header .brand .dot { color: var(--accent); }
  header .brand .sub { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 14px; }

  header .spacer { flex: 1; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
  }
  .pill .led {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-mute);
  }
  .pill.running .led {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.6s infinite;
  }
  .pill.stopped .led { background: var(--red); }
  .pill.connected .led { background: var(--green); }
  .pill.disconnected .led { background: var(--yellow); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  button {
    font: inherit;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) {
    background: #e8ecf3;
    border-color: var(--border-strong);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { color: var(--red); border-color: #f3c5cc; }
  button.danger:hover:not(:disabled) { background: #fdecee; }

  /* ── Tabs ─────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    flex-shrink: 0;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-mute);
    font-weight: 500;
  }
  .tab.active .badge { color: var(--accent); }

  /* ── Stats row ────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .stat .value {
    font-size: 26px;
    font-weight: 700;
    font-family: var(--mono);
    line-height: 1.1;
  }
  .stat .sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .stat .value.ok { color: var(--green); }
  .stat .value.warn { color: var(--yellow); }
  .stat .value.err { color: var(--red); }
  .stat .value.accent { color: var(--accent); }

  /* ── Toolbar ──────────────────────────────────── */
  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    font: inherit;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
  }
  .toolbar input { flex: 1; min-width: 220px; }
  .toolbar input:focus, .toolbar select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .toolbar .count {
    font-size: 13px;
    color: var(--text-dim);
    margin-left: auto;
    font-family: var(--mono);
  }

  /* ── Log list ─────────────────────────────────── */
  #log-container {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }

  .log-row {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: grid;
    grid-template-columns: 70px 110px 200px 1fr 90px;
    gap: 16px;
    align-items: baseline;
    transition: background 0.1s;
  }
  .log-row:hover { background: var(--panel-2); }

  .log-row .seq {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-mute);
  }
  .log-row .time {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mute);
  }

  .log-row .event {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* color-code by event prefix */
  .ev-beat   .event { color: var(--accent); }
  .ev-tool   .event { color: var(--cyan); }
  .ev-task   .event { color: var(--green); }
  .ev-sprint .event { color: var(--purple); }
  .ev-role   .event { color: var(--orange); }
  .ev-error  .event,
  .ev-error  .seq,
  .ev-error  .time { color: var(--red); }
  .ev-error  { background: rgba(217,55,72,0.05); }
  .ev-audit  .event { color: var(--text-dim); }
  .ev-permission .event,
  .ev-meeting    .event,
  .ev-artifact   .event,
  .ev-approval   .event,
  .ev-memory     .event,
  .ev-agent      .event,
  .ev-idempotency .event { color: var(--pink); }

  .log-row .summary {
    font-size: 15px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-row .summary .k {
    color: var(--text-mute);
    margin-right: 4px;
  }
  .log-row .summary .v {
    font-family: var(--mono);
    color: var(--text);
    margin-right: 12px;
  }

  .log-row .duration {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-align: right;
  }
  .log-row .duration.slow { color: var(--yellow); }
  .log-row .duration.veryslow { color: var(--red); }

  .log-row.expanded { background: var(--panel-2); }
  .log-detail {
    padding: 0 24px 16px 230px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    display: none;
  }
  .log-detail.open { display: block; }
  .log-detail pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }

  /* ── Empty / loading ──────────────────────────── */
  .empty {
    padding: 80px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 16px;
  }
  .empty .big { font-size: 22px; color: var(--text); margin-bottom: 8px; }

  /* ── Scrollbar ────────────────────────────────── */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #b3bac6; }
</style>
</head>
<body>

<header>
  <div class="brand">arceus<span class="dot">·</span>inspector<span class="sub">/api/inspector · Spec 32</span></div>
  <span id="hb-pill" class="pill stopped"><span class="led"></span><span id="hb-text">heartbeat: …</span></span>
  <button id="btn-start">Start</button>
  <button id="btn-stop" class="danger">Stop</button>
  <button id="btn-trigger">Trigger beat</button>
  <span class="spacer"></span>
  <span id="sse-pill" class="pill disconnected"><span class="led"></span><span id="sse-text">connecting…</span></span>
</header>

<div class="stats">
  <div class="stat">
    <div class="label">Heartbeat</div>
    <div class="value" id="stat-hb">—</div>
    <div class="sub" id="stat-hb-sub">no beats yet</div>
  </div>
  <div class="stat">
    <div class="label">Buffer</div>
    <div class="value accent" id="stat-buffer">0</div>
    <div class="sub" id="stat-buffer-sub">capacity —</div>
  </div>
  <div class="stat">
    <div class="label">Beats</div>
    <div class="value" id="stat-beats">0</div>
    <div class="sub" id="stat-beats-sub">pass —, fail —</div>
  </div>
  <div class="stat">
    <div class="label">Tools</div>
    <div class="value" id="stat-tools">0</div>
    <div class="sub" id="stat-tools-sub">denied —</div>
  </div>
  <div class="stat">
    <div class="label">Errors</div>
    <div class="value" id="stat-errors">0</div>
    <div class="sub">in current view</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="events">Events <span class="badge" id="tab-events-count">0</span></button>
  <button class="tab" data-tab="audit">Audit <span class="badge" id="tab-audit-count">0</span></button>
</div>

<div class="toolbar">
  <input id="filter-text" type="text" placeholder="Search event / role / tool / beat / company / payload…" />
  <select id="filter-event">
    <option value="">All events</option>
    <optgroup label="Beat">
      <option>beat.started</option>
      <option>beat.context</option>
      <option>beat.completed</option>
      <option>beat.scored</option>
      <option>beat.idle</option>
    </optgroup>
    <optgroup label="Tool">
      <option>tool.invoked</option>
      <option>tool.result</option>
      <option>tool.denied</option>
    </optgroup>
    <optgroup label="Task">
      <option>task.created</option>
      <option>task.updated</option>
      <option>task.artifact_attached</option>
    </optgroup>
    <optgroup label="Sprint">
      <option>sprint.created</option>
      <option>sprint.completed</option>
    </optgroup>
    <optgroup label="Other">
      <option>role.handoff</option>
      <option>artifact.created</option>
      <option>approval.requested</option>
      <option>approval.resolved</option>
      <option>meeting.recorded</option>
      <option>meeting.contribution</option>
      <option>memory.written</option>
      <option>permission.asked</option>
      <option>permission.replied</option>
      <option>agent.reasoning</option>
      <option>idempotency.replay</option>
      <option>error</option>
      <option>audit</option>
      <option>persist.failed</option>
    </optgroup>
  </select>
  <select id="filter-role">
    <option value="">All roles</option>
  </select>
  <button id="btn-pause">Pause</button>
  <button id="btn-clear">Clear</button>
  <span class="count" id="visible-count">0 / 0 events</span>
</div>

<div id="log-container">
  <div class="empty"><div class="big">Waiting for events…</div>Connecting to /api/inspector/events/stream</div>
</div>

<script>
  // ── State ──────────────────────────────────────
  const MAX_EVENTS = 3000;
  let events = [];        // newest-first
  let paused = false;
  let expanded = new Set();
  let sse = null;
  let activeTab = 'events'; // 'events' | 'audit'
  const seenSeqs = new Set();
  const knownRoles = new Set();

  // ── DOM ────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const container = $('log-container');
  const filterText = $('filter-text');
  const filterEvent = $('filter-event');
  const filterRole = $('filter-role');

  // ── Helpers ────────────────────────────────────
  function fmtTime(ts) {
    if (typeof ts !== 'number') return '--:--:--';
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `${hh}:${mm}:${ss}.${ms}`;
  }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function shortId(id) {
    if (!id || typeof id !== 'string') return '';
    return id.length > 10 ? id.slice(0, 8) : id;
  }

  // ── Per-event summary line builder ────────────
  function buildSummary(ev) {
    // Returns array of { k, v } chips shown inline.
    const out = [];
    const push = (k, v) => v != null && v !== '' && out.push({ k, v: String(v) });
    switch (ev.event) {
      case 'beat.started':
        push('role', ev.role); push('beat', shortId(ev.beatId));
        push('trust', ev.trustBand); push('sprint', shortId(ev.sprintId));
        break;
      case 'beat.completed':
        push('role', ev.role); push('beat', shortId(ev.beatId));
        push('verdict', ev.verdictOutcome);
        push('score', typeof ev.verdictScore === 'number' ? ev.verdictScore.toFixed(2) : ev.verdictScore);
        break;
      case 'beat.idle':
        push('beat', shortId(ev.beatId)); push('stalledMs', ev.stalledMs);
        break;
      case 'beat.context':
        push('role', ev.role); push('beat', shortId(ev.beatId));
        push('shown', (ev.shownTasks || []).length + ' tasks');
        if (Array.isArray(ev.shownTasks) && ev.shownTasks.length > 0) {
          push('ids', ev.shownTasks.map(t => shortId(t.id)).join(','));
        }
        break;
      case 'beat.scored':
        push('beat', shortId(ev.beatId));
        push('verdict', ev.verdict);
        push('branch', ev.branch);
        push('toolInvoked', ev.toolInvoked);
        push('claim', ev.claimedOk ? 'ok' : '-');
        push('complete', ev.completedOrBlocked ? 'ok' : '-');
        push('shown', ev.shownClaimableCount + ' claimable');
        break;
      case 'role.handoff':
        push('from', ev.from); push('to', ev.to); push('reason', ev.reason);
        break;
      case 'tool.invoked':
        push('tool', ev.tool); push('role', ev.role); push('beat', shortId(ev.beatId));
        if (ev.idempotencyKey) push('idem', shortId(ev.idempotencyKey));
        break;
      case 'tool.result':
        push('tool', ev.tool); push('ok', ev.ok ? '✓' : '✗');
        if (ev.cause) push('cause', ev.cause);
        break;
      case 'tool.denied':
        push('tool', ev.tool); push('role', ev.role); push('reason', ev.reason);
        break;
      case 'task.created':
        push('task', shortId(ev.taskId)); push('role', ev.assignedRole);
        push('sprint', shortId(ev.sprintId));
        break;
      case 'task.updated':
        push('task', shortId(ev.taskId)); push('patch', (ev.patch || []).join(','));
        break;
      case 'task.artifact_attached':
        push('task', shortId(ev.taskId)); push('artifact', shortId(ev.artifactId));
        break;
      case 'sprint.created':
        push('sprint', shortId(ev.sprintId)); push('goal', ev.goal);
        break;
      case 'sprint.completed':
        push('sprint', shortId(ev.sprintId));
        break;
      case 'artifact.created':
        push('artifact', shortId(ev.artifactId)); push('kind', ev.kind);
        break;
      case 'approval.requested':
      case 'approval.resolved':
        push('approval', shortId(ev.approvalId));
        if (ev.kind) push('kind', ev.kind);
        if (ev.outcome) push('outcome', ev.outcome);
        break;
      case 'meeting.recorded':
        push('meeting', shortId(ev.meetingId));
        push('participants', (ev.participants || []).join(','));
        break;
      case 'meeting.contribution':
        push('meeting', shortId(ev.meetingId)); push('position', ev.position);
        break;
      case 'memory.written':
        push('scope', ev.scope); push('bytes', ev.sizeBytes);
        break;
      case 'permission.asked':
      case 'permission.replied':
        push('tool', ev.tool); push('beat', shortId(ev.beatId));
        if ('granted' in ev) push('granted', ev.granted ? '✓' : '✗');
        break;
      case 'agent.reasoning':
        push('role', ev.role); push('beat', shortId(ev.beatId));
        push('text', String(ev.text).slice(0, 120));
        break;
      case 'error':
        push('where', ev.where); push('msg', ev.message);
        if (ev.beatId) push('beat', shortId(ev.beatId));
        break;
      case 'audit':
        push('cat', ev.category); push('sev', ev.severity);
        if (ev.agentRole) push('role', ev.agentRole);
        push('msg', ev.summary);
        break;
      case 'idempotency.replay':
        push('tool', ev.tool); push('key', shortId(ev.key));
        break;
      case 'persist.failed':
        push('table', ev.table); push('id', shortId(ev.id)); push('pg', ev.pgCode);
        break;
      default:
        // Fall back to dumping any non-meta scalar fields.
        for (const [k, v] of Object.entries(ev)) {
          if (['event','ts','seq'].includes(k)) continue;
          if (v && typeof v === 'object') continue;
          push(k, v);
        }
    }
    return out;
  }

  function eventClass(ev) {
    if (!ev || !ev.event) return '';
    const prefix = ev.event.split('.')[0];
    return 'ev-' + prefix;
  }

  function durationCell(ev) {
    const ms = ev.durationMs;
    if (typeof ms !== 'number') return '';
    let cls = '';
    if (ms > 5000) cls = ' veryslow';
    else if (ms > 1000) cls = ' slow';
    return `<div class="duration${cls}">${ms.toFixed(0)} ms</div>`;
  }

  function passesFilter(ev) {
    // Tab gate: audit tab shows only audit events; events tab hides them.
    if (activeTab === 'audit') {
      if (ev.event !== 'audit') return false;
    } else {
      if (ev.event === 'audit') return false;
    }
    const evF = filterEvent.value;
    if (evF && ev.event !== evF) return false;
    const roleF = filterRole.value;
    if (roleF && ev.role !== roleF && ev.agentRole !== roleF && ev.from !== roleF && ev.to !== roleF) return false;
    const q = filterText.value.trim().toLowerCase();
    if (q) {
      const hay = JSON.stringify(ev).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function refreshRoleFilter() {
    const current = filterRole.value;
    const opts = ['<option value="">All roles</option>'];
    for (const r of [...knownRoles].sort()) {
      opts.push(`<option ${r === current ? 'selected' : ''}>${escapeHtml(r)}</option>`);
    }
    filterRole.innerHTML = opts.join('');
  }

  // ── Render ─────────────────────────────────────
  function render() {
    const filtered = events.filter(passesFilter);
    const errCount = filtered.filter(e => e.event === 'error').length;
    const beatStarted = events.filter(e => e.event === 'beat.started').length;
    const beatCompleted = events.filter(e => e.event === 'beat.completed');
    const passes = beatCompleted.filter(e => e.verdictOutcome === 'pass').length;
    const fails  = beatCompleted.filter(e => e.verdictOutcome === 'fail').length;
    const toolInvoked = events.filter(e => e.event === 'tool.invoked').length;
    const toolDenied = events.filter(e => e.event === 'tool.denied').length;

    const auditCount = events.filter(e => e.event === 'audit').length;
    const nonAuditCount = events.length - auditCount;
    $('tab-events-count').textContent = nonAuditCount;
    $('tab-audit-count').textContent = auditCount;

    $('visible-count').textContent = `${filtered.length} / ${activeTab === 'audit' ? auditCount : nonAuditCount} ${activeTab === 'audit' ? 'audit' : 'events'}`;
    $('stat-beats').textContent = beatStarted;
    $('stat-beats-sub').textContent = `pass ${passes}, fail ${fails}`;
    $('stat-tools').textContent = toolInvoked;
    $('stat-tools-sub').textContent = `denied ${toolDenied}`;
    $('stat-errors').textContent = errCount;
    $('stat-errors').className = 'value' + (errCount > 0 ? ' err' : '');

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty"><div class="big">No matching events</div>${events.length === 0 ? 'Connected — waiting for the next emit.' : 'Adjust filters to see more.'}</div>`;
      return;
    }

    const html = filtered.slice(0, 600).map(ev => {
      const isOpen = expanded.has(ev.seq);
      const summaryChips = buildSummary(ev).map(c =>
        `<span class="k">${escapeHtml(c.k)}</span><span class="v">${escapeHtml(c.v)}</span>`
      ).join('');
      const cls = eventClass(ev);
      return `
        <div class="log-row ${cls} ${isOpen ? 'expanded' : ''}" data-seq="${ev.seq}">
          <div class="seq">#${ev.seq}</div>
          <div class="time">${fmtTime(ev.ts)}</div>
          <div class="event">${escapeHtml(ev.event)}</div>
          <div class="summary">${summaryChips}</div>
          ${durationCell(ev)}
        </div>
        <div class="log-detail ${isOpen ? 'open' : ''}">
          <pre>${escapeHtml(JSON.stringify(ev, null, 2))}</pre>
        </div>
      `;
    }).join('');
    container.innerHTML = html;
  }

  // ── Event ingestion ────────────────────────────
  function addEvent(ev) {
    if (!ev || typeof ev.seq !== 'number' || seenSeqs.has(ev.seq)) return;
    seenSeqs.add(ev.seq);
    events.unshift(ev);
    if (events.length > MAX_EVENTS) {
      const dropped = events.splice(MAX_EVENTS);
      dropped.forEach(d => seenSeqs.delete(d.seq));
    }
    // Track roles for the filter.
    let roleAdded = false;
    for (const k of ['role', 'agentRole', 'assignedRole', 'from', 'to']) {
      if (typeof ev[k] === 'string' && !knownRoles.has(ev[k])) {
        knownRoles.add(ev[k]);
        roleAdded = true;
      }
    }
    if (roleAdded) refreshRoleFilter();
  }

  // Throttle re-renders (4 Hz max).
  let renderPending = false;
  function scheduleRender() {
    if (paused || renderPending) return;
    renderPending = true;
    setTimeout(() => { renderPending = false; render(); }, 250);
  }

  // ── Click to expand ────────────────────────────
  container.addEventListener('click', (e) => {
    const row = e.target.closest('.log-row');
    if (!row) return;
    const seq = Number(row.dataset.seq);
    if (expanded.has(seq)) expanded.delete(seq);
    else expanded.add(seq);
    render();
  });

  // ── Filters ────────────────────────────────────
  [filterText, filterEvent, filterRole].forEach(el => el.addEventListener('input', render));

  // ── Tabs ───────────────────────────────────────
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  // ── Pause / clear ──────────────────────────────
  $('btn-pause').addEventListener('click', () => {
    paused = !paused;
    $('btn-pause').textContent = paused ? 'Resume' : 'Pause';
    if (!paused) render();
  });
  $('btn-clear').addEventListener('click', () => {
    events = [];
    seenSeqs.clear();
    expanded.clear();
    render();
  });

  // ── SSE ────────────────────────────────────────
  function connectStream() {
    if (sse) sse.close();
    sse = new EventSource('/api/inspector/events/stream?limit=300');
    sse.onopen = () => {
      $('sse-pill').className = 'pill connected';
      $('sse-text').textContent = 'live stream';
    };
    sse.onerror = () => {
      $('sse-pill').className = 'pill disconnected';
      $('sse-text').textContent = 'reconnecting…';
    };
    // Inspector emits named SSE events ("arceus" + "ping"), not default "message".
    sse.addEventListener('arceus', (msg) => {
      try {
        const ev = JSON.parse(msg.data);
        addEvent(ev);
        scheduleRender();
      } catch { /* ignore */ }
    });
  }

  // ── Inspector buffer stats ─────────────────────
  async function refreshBufferStats() {
    try {
      const r = await fetch('/api/inspector/stats');
      const d = await r.json();
      $('stat-buffer').textContent = d.size ?? 0;
      $('stat-buffer-sub').textContent = `capacity ${d.capacity ?? '—'} · seq ${d.nextSeq ?? '—'}`;
    } catch { /* ignore */ }
  }

  // ── Heartbeat controls ─────────────────────────
  async function refreshHeartbeat() {
    try {
      const r = await fetch('/api/heartbeat/status');
      const d = await r.json();
      const running = !!d.running;
      $('hb-pill').className = 'pill ' + (running ? 'running' : 'stopped');
      $('hb-text').textContent = 'heartbeat: ' + (running ? 'running' : 'stopped');
      $('btn-start').disabled = running;
      $('btn-stop').disabled = !running;
      $('stat-hb').textContent = running ? 'on' : 'off';
      $('stat-hb').className = 'value ' + (running ? 'ok' : 'warn');
      const beats = d.beatCount ?? d.totalBeats ?? d.count;
      $('stat-hb-sub').textContent = beats != null ? `${beats} beats` : (d.lastBeatAt ? 'last: ' + new Date(d.lastBeatAt).toTimeString().slice(0,8) : 'no beats yet');
    } catch {
      $('hb-text').textContent = 'heartbeat: ?';
    }
  }
  $('btn-start').addEventListener('click', async () => {
    await fetch('/api/heartbeat/start', { method: 'POST' });
    refreshHeartbeat();
  });
  $('btn-stop').addEventListener('click', async () => {
    await fetch('/api/heartbeat/stop', { method: 'POST' });
    refreshHeartbeat();
  });
  $('btn-trigger').addEventListener('click', async () => {
    await fetch('/api/heartbeat/trigger', { method: 'POST' });
    refreshHeartbeat();
  });

  // ── Boot ───────────────────────────────────────
  connectStream();
  refreshHeartbeat();
  refreshBufferStats();
  setInterval(refreshHeartbeat, 3000);
  setInterval(refreshBufferStats, 2000);
</script>
</body>
</html>
