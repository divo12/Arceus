services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    ports:
      - "5433:5432"
    volumes:
      - hippocampus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hippocampus"]
      interval: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - hippocampus-redis:/data

  neo4j:
    image: neo4j:5.10
    environment:
      NEO4J_AUTH: neo4j/hippocampus
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - hippocampus-neo4j:/data

volumes:
  hippocampus-postgres:
  hippocampus-redis:
  hippocampus-neo4j:
