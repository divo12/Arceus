[project]
name = "paperclip-hippocampus-runtime"
version = "0.1.0"
description = "Embedded Hippocampus runtime vendored into Paperclip"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "neo4j>=5.28.2",
    "openai>=2.29.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.2",
    "redis>=5.2",
    "sentence-transformers>=3.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arceus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
